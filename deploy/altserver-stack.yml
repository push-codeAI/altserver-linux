# AltServer-Linux + anisette — the whole thing as one Portainer stack.
#
# Portainer: Stacks -> Add stack -> Repository, point it at this repo and set the compose path to
# deploy/altserver-stack.yml. Or paste this into the Web editor.
#
# LAN-ONLY BY DESIGN. Sideloading never leaves the local network. Do NOT put either service behind
# Nginx Proxy Manager and do NOT give them a Cloudflare Tunnel route.
#
# ----------------------------------------------------------------------------------------------
# NO HOST PREP NEEDED. This uses NAMED VOLUMES, which Docker creates on first deploy -- and when a
# named volume is first mounted over a path that already exists in the image, Docker copies that
# path's contents AND ITS OWNERSHIP into the volume. The anisette image ships
# /home/Alcoholic/.config/anisette-v3 owned by uid 1000, so the volume inherits that and the
# chown a bind mount would have required is unnecessary.
#
# The one genuine prerequisite is outside Docker's reach: the phone must have been paired over USB
# once (README.md, Setup step 2) so /var/lib/lockdown holds a pairing record. Wireless pairing is not
# possible in this build.
#
# MIGRATING AN EXISTING BIND-MOUNT DEPLOYMENT: if you already have a provisioned identity at
# /opt/stacks/anisette/config, do NOT just redeploy -- the new volume starts empty and the server
# will mint a new machine, which costs you a 2FA prompt on every refresh. Copy it across first:
#
#   docker compose stop anisette
#   docker run --rm -v /opt/stacks/anisette/config:/from \
#                   -v altserver_anisette-config:/to alpine \
#                   sh -c 'cp -a /from/. /to/'
#   docker compose up -d anisette
#   curl -sS http://127.0.0.1:6969/ | grep -o '"X-Mme-Device-Id":"[^"]*"'   # must be UNCHANGED
#
# The volume name is <stack>_anisette-config; adjust the prefix to your stack's name.
# ----------------------------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------------------------
  # Anisette. Supplies the Apple machine identity. See deploy/anisette-stack.yml for the full
  # annotated version and the reasoning behind every line here.
  # --------------------------------------------------------------------------------------------
  anisette:
    image: dadoum/anisette-v3-server@sha256:1e20384985d3c49965f444bef39d627768dacc39ea0dca91f2a535edb7591ba3
    container_name: anisette
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      # MUST stay UTC. The server stamps X-Apple-I-Client-Time from LOCAL time and appends a
      # literal "Z", so any other TZ sends Apple a timestamp wrong by your offset while claiming
      # to be UTC. Do not copy TZ from the other stacks on this host.
      TZ: UTC
    ports:
      # Loopback only. AltServer reaches this via the host's loopback because it runs with
      # network_mode: host below.
      - "127.0.0.1:6969:6969"
    volumes:
      # The machine identity. Mount this DIRECTORY, never its lib/ subdirectory — the upstream
      # README says lib/, which persists only the Apple .so cache and loses device.json + adi.pb
      # on every stack update. That is issue #86.
      # Swap for an absolute bind mount if you prefer an inspectable host path:
      #   - /opt/stacks/anisette/config:/home/Alcoholic/.config/anisette-v3
      # ...but then you must mkdir it and chown it to 1000:1000 first.
      - anisette-config:/home/Alcoholic/.config/anisette-v3

    # Same probe as deploy/anisette-stack.yml: /v3/client_info is a static reply (no ADI, no Apple
    # contact); never "/", which provisions against Apple on newer images. curl is in this digest
    # (its second layer installs it). A Portainer signal only: plain Compose never restarts an
    # unhealthy container, which is what we want here.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6969/v3/client_info"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 5m

  # --------------------------------------------------------------------------------------------
  # AltServer itself.
  # --------------------------------------------------------------------------------------------
  # --------------------------------------------------------------------------------------------
  # netmuxd -- what makes WIRELESS refresh work. Without this, refresh requires a cable, which
  # defeats the entire point of running AltServer on a home server.
  #
  # Stock usbmuxd enumerates USB and nothing else; it has no network-device support at all. Worse,
  # on Ubuntu the usbmuxd unit is `static` and udev-activated -- it starts when a cable is plugged
  # in and EXITS when the last device is unplugged. Measured on a healthy setup with no cable:
  #
  #     $ idevice_id -l
  #     ERROR: Unable to retrieve device list!      <- not "no devices": the socket had no listener
  #     $ systemctl is-active usbmuxd
  #     inactive
  #
  # So an unattended server has NO mux running at all, and AltServer fails every
  # InstallProvisioningProfilesRequest with what looks like a device fault.
  #
  # netmuxd browses _apple-mobdev2._tcp, tracks the phone, and serves the usbmuxd socket protocol
  # with the device presented as ConnectionType Network.
  #
  # WHY ITS OWN SOCKET PATH, not /var/run/usbmuxd: taking over the host socket would mean masking
  # the host's usbmuxd, and a bind-mounted socket FILE cannot be replaced from inside a container
  # anyway. Keeping netmuxd on a private path in a named volume means the host's usbmuxd is left
  # completely alone -- it still handles the cable for first-time pairing -- while AltServer is
  # pointed at netmuxd via USBMUXD_SOCKET_ADDRESS. Nothing contends for anything.
  #
  # The UNIX: prefix is not a guess: upstream_repo/libusbmuxd/src/libusbmuxd.c:160 checks for it
  # and calls socket_connect_unix() on the remainder.
  # --------------------------------------------------------------------------------------------
  netmuxd:
    image: ${ALTSERVER_IMAGE:-ghcr.io/ben-diehlci/altserver-linux:latest}
    container_name: netmuxd
    restart: unless-stopped

    # REQUIRED. mDNS is link-local multicast and does not cross a Docker bridge, so on a bridge
    # netmuxd would never see the phone. Note it uses the pure-Rust mdns-sd crate rather than
    # avahi, so unlike altserver it needs NO D-Bus or avahi sockets -- and it coexists with the
    # host's avahi-daemon on UDP 5353 rather than fighting it.
    network_mode: host

    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Runs netmuxd instead of AltServer; the normal entrypoint fetches an IPA and execs the server.
    entrypoint: ["/usr/local/bin/netmuxd"]
    command:
      - "--socket-path"
      - "/run/muxd/usbmuxd"
      # Where the pairing record from the one-time USB pairing lives. netmuxd needs it to identify
      # and talk to the device it finds over mDNS.
      - "--plist-storage"
      - "/var/lib/lockdown"
      # USB is the host usbmuxd's job -- see above. Serving it here would need /dev/bus/usb and
      # would duplicate something that already works.
      - "--disable-usb"

    volumes:
      # The socket netmuxd creates, shared with altserver. A named volume (a DIRECTORY) rather
      # than a bind-mounted socket file, because the socket has to be created at startup.
      - muxd-socket:/run/muxd
      # Read-only: netmuxd reads the pairing record, it does not maintain it.
      - /var/lib/lockdown:/var/lib/lockdown:ro

    # One ListDevices round trip on the socket every 5 min (an empty list is healthy). netmuxd
    # binds its socket in a spawned task, so a failed bind leaves the process running with no
    # socket and restart: never fires. After 3 failures in a row the script SIGTERMs tini
    # (init: true, required), which exits, so restart: unless-stopped starts a fresh netmuxd.
    # Skipped on images without the script.
    healthcheck:
      test: ["CMD-SHELL", "[ ! -f /opt/altserver-web/healthcheck.py ] || python3 /opt/altserver-web/healthcheck.py netmuxd --restart-after 3"]
      # 5 min, not less: netmuxd prints its whole device list for every ListDevices request.
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 1m

  altserver:
    # Published by .github/workflows/build_image.yml. ALL THREE services run this one image, so
    # choose it with ALTSERVER_IMAGE (Portainer stack environment or .env) rather than editing
    # one line -- a `build:` here alone would leave netmuxd and altserver-web on the default.
    #
    # The default is linux/amd64 ONLY: on a Raspberry Pi or any arm64 host its pull fails with
    # "no matching manifest for linux/arm64/v8". There, either point ALTSERVER_IMAGE at a
    # multi-arch build (ghcr.io/<your-account>/altserver-linux:latest once build_image.yml has
    # run for your fork), or build locally -- the Dockerfile picks the toolchain for the host's
    # architecture by itself:
    #     docker build -f docker/Dockerfile -t altserver-linux:local .
    #     ALTSERVER_IMAGE=altserver-linux:local   (and turn OFF "re-pull image" in Portainer)
    image: ${ALTSERVER_IMAGE:-ghcr.io/ben-diehlci/altserver-linux:latest}
    # Or let compose build it (plain `docker compose`; set ALTSERVER_IMAGE to a local tag so the
    # other two services use the result):
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: altserver
    restart: unless-stopped
    depends_on:
      - anisette
      # Wireless device transport. Without it AltServer has no mux to reach the phone through.
      - netmuxd

    # REQUIRED for mDNS. Docker's default AppArmor profile denies D-Bus method calls, blocking
    # the very first one a client makes:
    #   apparmor="DENIED" operation="dbus_method_call" member="Hello" label="docker-default"
    # avahi-compat talks to avahi-daemon over the system bus, so without this the container cannot
    # reach it at all: DNSServiceRegister returns -65553 (Refused) and the server is silently
    # undiscoverable. Sockets, D-Bus policy and uid all look correct, because none of them are
    # ever consulted -- the call never leaves the container.
    #
    # BETTER OPTION, tested and shipped: deploy/apparmor/altserver-mdns is docker-default plus the
    # narrowest D-Bus rules Bonjour needs (the bus handshake and org.freedesktop.Avahi, nothing
    # else). Verified: under docker-default the call fails "Access denied" with an AppArmor denial
    # in the kernel log; under altserver-mdns it reaches the daemon with zero denials.
    #
    #     sudo bash deploy/apparmor/install.sh
    #
    # then set ALTSERVER_APPARMOR=altserver-mdns in Portainer's stack environment (or your .env)
    # and redeploy. It is a variable rather than an edit here so that deploying this repo
    # unchanged still works on a host that has not loaded the profile: a container asking for a
    # profile the kernel does not have FAILS TO START, which would be a hostile default.
    #
    # The default stays `unconfined` ONLY so that deploying straight from the repo works with no
    # host preparation: a container asking for a profile the host has not loaded FAILS TO START,
    # which would be a worse first experience than a container with one LSM relaxed. seccomp,
    # namespaces and cgroups still apply either way, so this is still more confined than running
    # AltServer directly on the host -- the actual alternative.
    #
    # RASPBERRY PI OS: none of the above applies. Its kernels build AppArmor in but enable no LSM
    # (bcm2711_defconfig: CONFIG_LSM=""), so Docker skips AppArmor entirely -- this line is
    # ignored, D-Bus is never denied, and install.sh stops at its kernel check. Leave it as is.
    security_opt:
      - apparmor=${ALTSERVER_APPARMOR:-unconfined}

    # REQUIRED. The binary installs no SIGTERM handler (its only signal call is
    # signal(SIGPIPE, SIG_IGN)), so as PID 1 the kernel discards docker stop's SIGTERM and every
    # restart costs the full 10s grace period followed by SIGKILL.
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # REQUIRED, and not negotiable: mDNS/Bonjour is link-local and does not cross a Docker bridge.
    # On a bridge the phone can never discover _altserver._tcp no matter what else is correct.
    # Note this makes `ports:` meaningless here — AltServer binds an EPHEMERAL port that differs
    # on every start (ConnectionManager sets sin_port = 0), so no static rule could work anyway.
    network_mode: host

    environment:
      # Reaches the anisette service above via the host's loopback.
      ALTSERVER_ANISETTE_SERVER: http://127.0.0.1:6969

      # Use netmuxd instead of the host's usbmuxd, so the phone is reachable over Wi-Fi with no
      # cable attached. Without this AltServer talks to /var/run/usbmuxd, which on an unattended
      # server is usually not running at all.
      # NOTE the spelling: libusbmuxd reads USBMUXD_SOCKET_ADDRESS. The widely-copied
      # USBMUXD_SOCKET_ADRESS (one D) is silently ignored and costs hours.
      USBMUXD_SOCKET_ADDRESS: UNIX:/run/muxd/usbmuxd

      # netmuxd presents the phone as a Network device, and AltServer's usbmuxd event subscription
      # only acts on USB devices (DeviceManager's attach handler uses connectedDevices(), which
      # excludes network ones) -- so with netmuxd it does nothing but keep a monitor thread
      # reconnecting. Requests look the phone up themselves. Any value disables it, even "0";
      # remove the line if you ever point AltServer at a USB mux instead.
      ALTSERVER_NO_SUBSCRIBE: "1"

      # The entrypoint refreshes /data/AltStore.ipa on every start, resolving the current
      # version from AltStore's own catalogue -- so there is no IPA to download by hand and
      # no hardcoded URL to go stale. Set to 1 to leave the file alone (e.g. to pin a build).
      ALTSTORE_SKIP_FETCH: "0"

      # Credentials. Prefer putting these in Portainer's stack environment variables rather than
      # committing them. They are only needed for sign-in; see README.md, Setup step 4.
      # Passing them here beats -p on a command line, which exposes the password in `ps`.
      ALTSERVER_UDID: "${ALTSERVER_UDID:-}"
      ALTSERVER_APPLE_ID: "${ALTSERVER_APPLE_ID:-}"
      ALTSERVER_APPLE_PASSWORD: "${ALTSERVER_APPLE_PASSWORD:-}"

    volumes:
      # AltServerData. The app writes to the RELATIVE path ./AltServerData against its working
      # directory, which the image sets to /data — so this mount is what makes it persist.
      # Also where to put AltStore.ipa for the first-time install.
      # Swap for a bind mount if you want to drop files in from the host easily:
      #   - /opt/stacks/altserver/data:/data
      - altserver-data:/data

      # The pairing record from the one-time USB pairing. Read-write: libimobiledevice may
      # refresh it. Losing this means fetching the cable again.
      - /var/lib/lockdown:/var/lib/lockdown

      # netmuxd's socket -- the wireless device path. This is the one that matters for refresh.
      - muxd-socket:/run/muxd

      # NOT the host's /var/run/usbmuxd. usbmuxd is udev-activated, so after a boot with no cable
      # that path does not exist and Docker creates an empty DIRECTORY there: the host usbmuxd then
      # dies on every start ("unlink(/var/run/usbmuxd) failed: Is a directory"), and a container
      # created while it was a socket cannot start at all any more (runc: "not a directory") --
      # which restart: never retries. AltServer only talks to netmuxd (USBMUXD_SOCKET_ADDRESS).

      # mDNS. The image ships python3 + libavahi-compat-libdnssd-dev, but the actual publishing is
      # done by the HOST's avahi-daemon, which avahi-compat reaches over the system D-Bus ONLY
      # (/run/avahi-daemon/socket is nss-mdns's protocol and is never opened). Without the bus the
      # server runs, reports success, and is silently undiscoverable.
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket

      # REQUIRED for the above to work. libdbus needs a machine ID to connect to the system bus,
      # and debian-slim ships none -- without it avahi fails at client creation with
      # "Access denied", which reads as a permissions problem on the sockets (they are fine) or
      # an avahi policy problem (also fine). Symptom: DNSServiceRegister returns -65553 (Refused).
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro

    # Every 5 min: AltServer holds a listening socket AND _altserver._tcp is advertised on that
    # port (/proc reads plus one avahi-browse; it never connects to AltServer). Catches the silent
    # states restart: cannot see -- an advert that never came back, or a listener that died.
    # After 3 failures in a row (15 min: never over one blip, or mid-refresh) the script
    # SIGTERMs tini so restart: unless-stopped starts a fresh AltServer (requires init: true,
    # set above). Skipped on images without the script.
    healthcheck:
      test: ["CMD-SHELL", "[ ! -f /opt/altserver-web/healthcheck.py ] || python3 /opt/altserver-web/healthcheck.py altserver --restart-after 3"]
      interval: 5m
      timeout: 60s
      retries: 3
      start_period: 3m
    # select()/FD_SET is used on every accepted socket and FD_SETSIZE is 1024: keep descriptors
    # below it so a leak ends in EMFILE (which exits and restarts) rather than memory corruption.
    ulimits:
      nofile: 1024

    # No IPA argument => daemon mode. The first-time install is a separate one-off run; see
    # README.md, Setup step 4. You can do it from Portainer's container console:
    #   AltServer -u "$ALTSERVER_UDID" -a "$ALTSERVER_APPLE_ID" -p "$ALTSERVER_APPLE_PASSWORD" /data/AltStore.ipa
    # It needs an interactive console because the 2FA code is read from stdin.
    command: []

  # --------------------------------------------------------------------------------------------
  # Setup web UI: status dashboard, pairing wizard, and the AltStore install flow with 2FA entry.
  # Reachable at http://<this-host>:8099 -- no port mapping, because network_mode: host binds it
  # straight onto the host.
  #
  # SECURITY: the install page accepts an Apple ID password over PLAIN HTTP. On a trusted home LAN
  # that is a considered trade-off; on anything shared, change the command below to
  # `--host 127.0.0.1` and reach it through an SSH tunnel instead:
  #     ssh -L 8099:127.0.0.1:8099 you@this-host
  # Do NOT put it behind the reverse proxy or a Cloudflare Tunnel -- it must not leave the LAN.
  # --------------------------------------------------------------------------------------------
  altserver-web:
    image: ${ALTSERVER_IMAGE:-ghcr.io/ben-diehlci/altserver-linux:latest}
    container_name: altserver-web
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Same host network as altserver, so it sees the same usbmuxd, the same avahi, and can report
    # on the real _altserver._tcp advertisement rather than a bridged illusion of it.
    network_mode: host

    # REQUIRED for mDNS. Docker's default AppArmor profile denies D-Bus method calls, blocking
    # the very first one a client makes:
    #   apparmor="DENIED" operation="dbus_method_call" member="Hello" label="docker-default"
    # avahi-compat talks to avahi-daemon over the system bus, so without this the container cannot
    # reach it at all: DNSServiceRegister returns -65553 (Refused) and the server is silently
    # undiscoverable. Sockets, D-Bus policy and uid all look correct, because none of them are
    # ever consulted -- the call never leaves the container.
    #
    # BETTER OPTION, tested and shipped: deploy/apparmor/altserver-mdns is docker-default plus the
    # narrowest D-Bus rules Bonjour needs (the bus handshake and org.freedesktop.Avahi, nothing
    # else). Verified: under docker-default the call fails "Access denied" with an AppArmor denial
    # in the kernel log; under altserver-mdns it reaches the daemon with zero denials.
    #
    #     sudo bash deploy/apparmor/install.sh
    #
    # then set ALTSERVER_APPARMOR=altserver-mdns in Portainer's stack environment (or your .env)
    # and redeploy. It is a variable rather than an edit here so that deploying this repo
    # unchanged still works on a host that has not loaded the profile: a container asking for a
    # profile the kernel does not have FAILS TO START, which would be a hostile default.
    #
    # The default stays `unconfined` ONLY so that deploying straight from the repo works with no
    # host preparation: a container asking for a profile the host has not loaded FAILS TO START,
    # which would be a worse first experience than a container with one LSM relaxed. seccomp,
    # namespaces and cgroups still apply either way, so this is still more confined than running
    # AltServer directly on the host -- the actual alternative.
    #
    # RASPBERRY PI OS: none of the above applies. Its kernels build AppArmor in but enable no LSM
    # (bcm2711_defconfig: CONFIG_LSM=""), so Docker skips AppArmor entirely -- this line is
    # ignored, D-Bus is never denied, and install.sh stops at its kernel check. Leave it as is.
    security_opt:
      - apparmor=${ALTSERVER_APPARMOR:-unconfined}

    # Lets the status page see whether the AltServer daemon is actually running. Containers have
    # separate PID namespaces, so without this a sidecar reports "not running" no matter how
    # healthy the daemon is -- a confident false negative, which is worse than no check.
    # Remove it if you would rather not expose the host process list; the page then reports that
    # check as "unknown" and tells you to judge by the mDNS result instead, which is the
    # trustworthy signal anyway.
    pid: host

    depends_on:
      - anisette

    environment:
      # The status page checks this endpoint against the client's actual contract: liveness via
      # /v3/client_info on every poll, the full "/" contract at most every N seconds.
      ALTSERVER_ANISETTE_SERVER: http://127.0.0.1:6969
      ALTSERVER_ANISETTE_CHECK_INTERVAL: "600"
      # Independent time reference for the clock check (one HEAD per 15 min, plain HTTP on
      # purpose). The anisette timestamp cannot catch a wrong HOST clock: both containers read the
      # same kernel clock. Default is the Debian mirror apt already uses; "off" disables it. The
      # kernel's NTP state is read with adjtimex(), so no /run/systemd bind mount is needed.
      ALTSERVER_CLOCK_REFERENCE_URL: "http://deb.debian.org/debian/"
      # Nothing here fetches the IPA; that is altserver's job.
      ALTSTORE_SKIP_FETCH: "1"
      # The /install flow runs a real AltServer install from this container. The host's
      # /var/run/usbmuxd is no longer mounted (see altserver), so point it at netmuxd like the
      # daemon: the install goes over Wi-Fi to the already-paired phone. First-time pairing is
      # still done with the cable on the HOST (README step 2).
      USBMUXD_SOCKET_ADDRESS: UNIX:/run/muxd/usbmuxd

    volumes:
      # Shares altserver's data volume so the install flow can see the fetched AltStore.ipa.
      - altserver-data:/data
      # Read-WRITE. The status and pairing pages only read, but the install flow runs a real
      # AltServer install from this container, and libimobiledevice may refresh the pairing
      # record during device work. Read-only here fails in a way that looks like a device fault.
      - /var/lib/lockdown:/var/lib/lockdown
      # netmuxd's socket for the wireless checks. The host's /var/run/usbmuxd is deliberately NOT
      # mounted (see altserver: after a cable-less boot Docker turns it into a directory, which
      # breaks the host usbmuxd and stops this container from starting). Pair over USB on the
      # HOST (README step 2); the pairing page then continues over netmuxd.
      - muxd-socket:/run/muxd
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # Same machine-id requirement as altserver -- avahi-browse needs D-Bus too.
      - /etc/machine-id:/etc/machine-id:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro

    entrypoint: ["python3", "/opt/altserver-web/server.py"]
    command: ["--host", "0.0.0.0", "--port", "8099"]
    # Liveness only, report-only. NEVER add `|| kill 1` here: with pid: host, PID 1 is the HOST's
    # systemd, and SIGTERM makes it re-execute itself. (--restart-after refuses to signal anything
    # but Docker's init, but do not rely on that.)
    healthcheck:
      test: ["CMD-SHELL", "[ ! -f /opt/altserver-web/healthcheck.py ] || python3 /opt/altserver-web/healthcheck.py web"]
      interval: 5m
      timeout: 20s
      retries: 3

volumes:
  # Created automatically on first deploy. `docker volume inspect <stack>_anisette-config` shows
  # where they live on disk if you need to back them up -- and you SHOULD back up anisette-config,
  # since it holds the Apple machine identity. Losing it means re-provisioning and a fresh 2FA.
  anisette-config:
  altserver-data:
  # Holds only netmuxd's unix socket. Nothing persistent -- it exists so two containers can share
  # a directory that netmuxd is able to create a socket in.
  muxd-socket:
