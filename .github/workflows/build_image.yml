name: Build AltServer Image

# Publishes a self-contained AltServer image to ghcr.io/<owner>/altserver-linux, so a Portainer
# stack can just pull it instead of building on the host.
#
# Uses ${{ github.repository_owner }} rather than a hardcoded namespace, so a fork publishes to
# its OWN namespace and does not fail against someone else's.

on:
  push:
    branches:
      - new
    paths:
      - 'docker/**'
      - '.dockerignore'
      # The web UI is COPIED into the image, so changes to it must rebuild it. Omitting this
      # meant five commits of web fixes silently never reached a published image, and the
      # deployed stack kept serving known-broken code with no indication anything was stale.
      - 'web/**'
      - 'src/**'
      - 'shims/**'
      - 'makefiles/**'
      # The same failure as web/** above, one level down. The libraries/ submodules
      # (libimobiledevice, libusbmuxd, libplist, libimobiledevice-glue) and the
      # plain sources in libraries/dnssd_loader are COMPILED into the -static binary by the build
      # stage's `make`, so bumping one changes the SHIPPED BINARY. Without this entry the image
      # would keep the old binary and nothing would indicate it was stale.
      - 'libraries/**'
      - 'Makefile'
      - 'upstream_repo'
      - '.github/workflows/build_image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Runs --privileged and executes every instruction of the emulated arm64 compile, so it
          # can alter the binary it helps build. Pinned to the digest CI resolved on 2026-09-19.
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the owner: GHCR rejects uppercase in image names, and GitHub usernames may
      # contain capitals (Ben-Diehlci does).
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/altserver-linux" >> "$GITHUB_OUTPUT"

      # amd64 AND arm64 (Raspberry Pi). The toolchain images are single-arch, and the Dockerfile
      # picks the matching one from TARGETARCH -- so NO BUILDER build-arg here: a single BUILDER
      # would force one toolchain onto both platforms and mislabel the other one's binary.
      # The arm64 leg compiles under the QEMU set up above; build.yml's aarch64 leg, built the
      # same way, takes ~9 minutes.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ steps.name.outputs.image }}:latest (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The package is PRIVATE by default. To let Portainer pull it without credentials," >> "$GITHUB_STEP_SUMMARY"
          echo "make it public once: GitHub -> Packages -> altserver-linux -> Package settings ->" >> "$GITHUB_STEP_SUMMARY"
          echo "Change visibility -> Public." >> "$GITHUB_STEP_SUMMARY"
