name: Build AltServer

on:
  push:
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Also check upstream_repo for new commits and sync if it changed'
        required: false
        type: boolean
        default: false
      all_arches:
        description: 'Build every architecture, not just aarch64'
        required: false
        type: boolean
        default: false
  repository_dispatch:

  # NO schedule. This used to run `cron: "0 */4 * * *"` -- 6 times a day, ~180 runs a month --
  # watching the upstream_repo submodule, which is rileytestut/AltServer-Windows, NOT this repo's
  # upstream (NyaMisty/AltServer-Linux). AltServer-Windows has not moved since 071b1dd on
  # 2022-04-25, so every one of those runs found nothing.
  #
  # Removed for a second and better reason than noise. When it DID find a commit it ran
  # `git submodule update --remote -- upstream_repo` and built all four architectures from that
  # newer source WITHOUT committing it, so a published artifact could come from code no commit in
  # this repo describes. The build rewrites those sources textually
  # (makefiles/rewrite_altserver_source.py), and that rewriter has no match guards at all, so an
  # upstream move could change what the binary does with nothing failing -- see the TODO in
  # REVIVAL.md. An unattended job is the worst place for that.
  #
  # Nothing is lost: the same check still runs on demand via the `sync_upstream` input above. The
  # `github.event_name == 'schedule'` conditions in the check and matrix_setup jobs are left in
  # place, so restoring the cron here is the only edit needed to bring the old behaviour back.


env:
  REGISTRY: ghcr.io

jobs:
  # Two guards for failures that were invisible while everything reported success. They live HERE,
  # in the workflow with no paths: filter, because one of them detects a broken paths: filter --
  # a guard inside build_image.yml would be skipped by exactly the bug it is meant to catch.
  #
  # Fast and dependency-free, so they gate nothing and cost nothing.
  guards:
    runs-on: ubuntu-latest
    name: "Guards"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An omitted paths: entry meant five commits of web fixes never reached a published image,
      # while CI stayed green and the deployment kept serving the old code.
      - name: Everything copied into the image triggers a rebuild
        run: python3 tests/check_workflow_paths.py

      # The binary is compiled and statically linked inside another account's single-arch toolchain
      # images. A mutable tag, or the wrong architecture's image for a platform, changes what ships
      # while CI stays green -- the image's own ELF check only runs when an image is built.
      - name: Toolchain images are pinned by digest, one per architecture
        run: python3 tests/check_builder_pins.py

      # A literal newline inside a JS string literal once killed an entire <script> block. The
      # Python was well tested; nothing ever parsed what the browser actually runs.
      - name: Generated pages emit valid JavaScript
        run: python3 tests/check_page_js.py

      # A duplicate mapping key shipped because yaml.safe_load keeps the last one instead of
      # erroring, so the stack only broke at deploy time inside Portainer.
      - name: Compose files load the way Docker loads them
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 tests/check_compose.py

      # A usbmux network address is a raw sockaddr in the layout of whichever host produced it, and
      # the vendored parser understood only the BSD one -- so every Wi-Fi refresh failed as a device
      # fault while the phone sat plainly visible in the device list. Needs the real submodule
      # source, because the guard also proves the rewriter still matches it.
      - name: Fetch the libimobiledevice submodule
        run: git submodule update --init --depth 1 libraries/libimobiledevice

      - name: usbmux network addresses parse in both sockaddr layouts
        run: python3 tests/check_conn_data_layout.py

      # Every build-time rewriter must still apply to the pinned sources, and what they emit must
      # compile on a CURRENT compiler -- the shipped build runs on a frozen Alpine 3.15 toolchain
      # that cannot notice (AltSign's Archiver.cpp compiled there only by accident). A depth-1
      # fetch of upstream_repo is ~10 MiB and a few seconds; the build job would otherwise report
      # a drifted pattern only after ~9 minutes of emulated aarch64 compilation.
      - name: Fetch the upstream_repo submodule
        run: git submodule update --init --depth 1 upstream_repo

      - name: Rewriters apply, and their output compiles on a current toolchain
        run: |
          # minizip's headers include zlib.h, and zlib1g-dev is not in the runner image's package list
          test -f /usr/include/zlib.h || { sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev; }
          python3 tests/check_rewriters.py

      # installer.py's docstring promised every line was filtered while it printed the anisette
      # MachineID, one-time password and local user ID in full, into a page served over plain HTTP.
      # This feeds it real captured output and fails if any secret value survives.
      - name: Install-log redaction actually redacts
        run: python3 tests/check_redaction.py

      # A phone that closed or reset its connection mid-request left a worker spinning at 100% of a
      # core and logging ~700,000 lines a second, forever; one that vanished without a FIN held a
      # worker forever, and cpprestsdk has 40. Needs the real submodule: the guard also proves the
      # rewriter still matches it, and compiles its output against stubs (no cpprestsdk needed).
      - name: Fetch the AltServer submodule
        run: git submodule update --init --depth 1 upstream_repo

      - name: The TCP transport survives a phone that goes away
        run: python3 tests/check_wireless_connection.py

      # One 100 MB app upload printed 52,871 per-chunk progress lines: 5 MB of docker log, and every
      # useful line pushed out of the 1 MB file the web UI shows. The filter now folds them; this
      # fails if it ever drops, reorders or delays anything else, or stops recording refreshes.
      - name: Log filter folds progress without losing lines
        run: python3 tests/check_log_filter.py

      # The clock check compared the anisette timestamp with this host's clock -- on one host the
      # same kernel clock -- so a Pi running hours slow after a power cut read "within 0s". It
      # also fetched "/" every 30 s, which on current anisette images provisions against Apple.
      - name: Clock check sees a wrong host clock; anisette "/" is rate-limited
        run: python3 tests/check_status_clock.py

      # The install page takes an Apple ID password on 0.0.0.0. It accepted cross-origin text/plain
      # POSTs (CSRF), any Host (DNS rebinding), unbounded bodies, and spawned one AltServer per
      # concurrent POST. Exercised against a live server with a fake AltServer, not by grepping.
      - name: Web UI refuses CSRF, rebinding, oversized bodies and double installs
        run: python3 tests/check_web_security.py

      # A Docker healthcheck only marks a container unhealthy, so the stack's checks restart the
      # service by SIGTERMing PID 1. One failed probe must never do that (an avahi restart is a
      # few seconds with no advert), and under pid: host PID 1 is the host's systemd.
      - name: Healthchecks restart only after repeated failures, only via Docker's init
        run: python3 tests/check_healthcheck.py

      # netmuxd matches the phone by its Bonjour TXT keys since iOS 26.4. If an iOS update changes
      # them, netmuxd silently lists nothing while the page blamed the network.
      - name: Status page shows the phone's TXT form and names a netmuxd/iOS mismatch
        run: python3 tests/check_status_advert.py

  check:
    runs-on: ubuntu-latest
    name: "Check Upstream Updates"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check If Need Checking
        id: needCheck
        if: ${{ github.event_name == 'schedule' || ( github.event_name == 'workflow_dispatch' && inputs.sync_upstream ) }}
        run: |
          echo "needCheck=1" >> $GITHUB_ENV

      - name: Check Upstream Version
        id: check
        run: |
          if [[ "$needCheck" == 1 ]]; then
            echo "Checking changes in upstream_repo..."
            
            current_upstream=$(git ls-tree HEAD upstream_repo | awk '{ print $3 }')
            echo "Current Upstream Commit: $current_upstream"
            
            git submodule update --remote -- upstream_repo
            new_upstream=$( cd upstream_repo; git show -s --format=%H )
            echo "New Upstream Commit: $new_upstream"
            
            git reset --hard
            git submodule update --init
            if [[ "$current_upstream" != "$new_upstream" ]]; then
              echo "Upstream got new commits, go updating!"
              echo "updated=1" >> $GITHUB_OUTPUT
            else
              echo "Upstream no change~"
              echo "updated=0" >> $GITHUB_OUTPUT
            fi
          else
            echo "Needn't to check changes, directly return~"
            echo "updated=0" >> $GITHUB_OUTPUT
          fi
    outputs:
      updated: ${{ steps.check.outputs.updated }}

  # Decides which architectures to build. aarch64 alone for ordinary branch pushes -- this fork's
  # target is a Raspberry Pi -- and the full set for tags, for the scheduled upstream-sync run, and
  # on demand via the all_arches input. aarch64, armv7 and i386 run under QEMU on x86 runners
  # (the aarch64 leg takes ~9 minutes); amd64 is the only native one.
  #
  # Builders are pinned BY DIGEST. They are another account's mutable :latest tags, and the shipped
  # binary is compiled and statically linked inside them (LibreSSL, cpprestsdk, libzip, corecrypto),
  # so a re-push would change what ships with no commit here. Digests read from the registry on
  # 2026-09-25; the aarch64 one is exactly what the only CI run (2026-09-19) used. To move a pin:
  #   curl -fsS "https://ghcr.io/token?scope=repository:ben-diehlci/altserver_builder_alpine_aarch64:pull"
  #   then HEAD /v2/ben-diehlci/altserver_builder_alpine_aarch64/manifests/latest (Docker-Content-Digest).
  matrix_setup:
    runs-on: ubuntu-latest
    name: "Select architectures"
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick architectures
        id: pick
        run: |
          AMD64='{"arch":"amd64","builder":"ghcr.io/ben-diehlci/altserver_builder_alpine_amd64@sha256:45b98a4b96f2f1d6c719b3b03f95b097f82d9daf114a14fa1adfe6f022e64c58"}'
          AARCH64='{"arch":"aarch64","builder":"ghcr.io/ben-diehlci/altserver_builder_alpine_aarch64@sha256:1c9ee63177026f729ca524aa3e7c7c02c695b656a34ace4115b6fd26464c6492"}'
          ARMV7='{"arch":"armv7","builder":"ghcr.io/ben-diehlci/altserver_builder_alpine_armv7@sha256:4af319a2250597e1ba29e38d34550401fd06336e4c83c1689299bffc8a79bf0b"}'
          I386='{"arch":"i386","builder":"ghcr.io/ben-diehlci/altserver_builder_alpine_i386@sha256:6583eff61124014cfd5829591342b9cb997d030ccf059333ab87092fe99ada8e"}'

          if [[ "${{ github.ref }}" == refs/tags/* ]] \
             || [[ "${{ github.event_name }}" == "schedule" ]] \
             || [[ "${{ inputs.all_arches }}" == "true" ]]; then
            echo "Building ALL architectures"
            echo "matrix={\"include\":[$ARMV7,$AARCH64,$AMD64,$I386]}" >> "$GITHUB_OUTPUT"
          else
            echo "Branch push: building aarch64 only (push-codeAI fork: Raspberry Pi target). Use the all_arches input, or push a tag, for the full set."
            echo "matrix={\"include\":[$AARCH64]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check, matrix_setup]
    strategy:
      # Do not cancel the other legs when one fails: the emulated architectures are the most
      # likely to break, and killing a good amd64 build because armv7 died wastes the useful one.
      fail-fast: false
      # Computed by matrix_setup above. Each leg carries a short `arch` label because
      # actions/upload-artifact rejects '/' and ':' in artifact names, so the image reference
      # cannot be used as the name.
      matrix: ${{ fromJSON(needs.matrix_setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Do Submodule Update
        if: ${{ needs.check.outputs.updated == '1' }}
        run:
          git submodule update --remote -- upstream_repo
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # Runs --privileged and emulates every instruction of the aarch64 compiler, so it can
          # alter the binary it helps build. Pinned to the digest run 35439303454 resolved.
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare build
        run: mkdir /tmp/build_output
      - name: Build
        run: |
          image=${{ matrix.builder }}
          docker pull "$image"
          docker run --rm -v "${PWD}":/workdir -w /workdir "$image" bash -c 'mkdir build && cd build && make -f ../Makefile -j3'
          # A tarball, because both an artifact zip and a release download drop the exec bit:
          # the chmod +x that used to be here never reached the user. tar keeps the mode.
          (cd build && tar --owner=0 --group=0 --numeric-owner -czf "/tmp/build_output/AltServer-${{ matrix.arch }}.tar.gz" AltServer-*)
          tar -tvzf "/tmp/build_output/AltServer-${{ matrix.arch }}.tar.gz"
          sudo rm -rf build
          git clean -fdX
      - name: Upload to github artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # archive: false uploads the .tar.gz as-is (no zip around it); the artifact is then
          # named after the file, AltServer-<arch>.tar.gz. Its sha256 is shown with the artifact.
          path: /tmp/build_output/AltServer-${{ matrix.arch }}.tar.gz
          archive: false

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    # guards too: a tag must not publish a binary whose guards failed. They gate nothing else.
    needs: [guards, build]
    name: "release"
    permissions:
      contents: write
    steps:
    # merge-multiple puts every artifact in one flat directory. Without it, download-artifact@v8
    # nests each artifact in a directory named after it ONLY when the run has 2+ artifacts, so the
    # old `mv build_output/*/*` failed on any single-architecture tag.
    - name: "Download all artifacts"
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: build_release
        pattern: AltServer-*
        merge-multiple: true
    - name: "Check artifacts"
      run: |
        ls -la build_release
        [ -n "$(ls -A build_release)" ]
    - name: Release
      # Pinned to a commit, not the v3 tag: a tag is mutable, and this job publishes releases.
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: build_release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  update_submodule:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: ${{ needs.check.outputs.updated == '1' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Commit Submodule Update
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git submodule update --remote -- upstream_repo
          git commit -m "[server] Sync Upstream Repo commit" upstream_repo
      # Plain git push rather than a third-party action. ad-m/github-push-action@master was
      # unpinned -- a floating branch ref from another account, running in a job that holds
      # `contents: write` and is handed GITHUB_TOKEN. Whatever that branch pointed at on the day
      # would have run with permission to rewrite this repo. actions/checkout already persists
      # credentials, so nothing is gained by delegating the push.
      - name: Push changes
        run: git push origin HEAD:${{ github.ref }}
